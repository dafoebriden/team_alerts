[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team_alerts"
version = "0.1.0"
description = "Structured operational alerts with pluggable transports (Discord first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team" }]
dependencies = [
    "requests>=2.28,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_smoke: live Discord smoke checks",
    "live_severity_style: live Discord severity style checks",
    "live_plain: live plain-content Discord checks",
    "live_embed: live embed Discord checks",
    "live_exception: live exception/traceback Discord checks",
    "live_github: live GitHub metadata Discord checks",
]
